name: Keep Render Backend Awake

on:
  schedule:
    # Runs every 14 minutes to prevent Render's 15-minute inactivity spin-down
    - cron: "*/14 * * * *"
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  ping-server:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend API
        run: |
          curl -sSf https://multimodal-tb-detection-system.onrender.com/api/ping || echo "Ping failed, but workflow continues"

[project]
name = "multimodal-tb-detection-system"
version = "3.1.0"
description = "TB-Vision Pro: AI-Based Multimodal Tuberculosis Detection API"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "pydantic",
    "python-multipart",
    "passlib[bcrypt]",
    "pyjwt",
    "fpdf2",
    "scikit-learn",
    "scipy",
    "numpy",
    "pillow",
    "python-dotenv",
    "psycopg2-binary",
    "filetype==1.2.0",
    "resend",
    "opencv-python-headless",
    "torch==2.1.2+cpu",
    "torchvision==0.16.2+cpu",
]

[tool.vercel]
entrypoint = "backend.app.main:app"

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" }
]
torchvision = [
    { index = "pytorch-cpu" }
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
